version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phinox
      POSTGRES_USER: phinox
      POSTGRES_PASSWORD: phinox
    volumes:
      - phinox_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: celery -A config worker -l info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: celery -A config beat -l info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - db
      - redis

volumes:
  phinox_pgdata:
